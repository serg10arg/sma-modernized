server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # Directorio local donde se almacenan las configuraciones de cada servicio
          search-locations: classpath:/config

# Exponer endpoints de salud para Docker health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
