server:
  port: 8080

spring:
  # Conexión a PostgreSQL. Las credenciales se resuelven desde variables de
  # entorno en el contenedor del licensing-service (no en el config-server).
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sma_licensing}
    username: ${DB_USER:sma_user}
    password: ${DB_PASSWORD:sma_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # No se generan tablas automáticamente; el esquema lo crea schema.sql
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      # Ejecuta schema.sql y data.sql al arrancar
      mode: always
  security:
    oauth2:
      resourceserver:
        jwt:
          # El JwtDecoder resuelve el discovery del realm al arrancar -> Keycloak debe estar healthy
          issuer-uri: http://keycloak:8080/realms/sma
      # Cliente OAuth2 (7c): credenciales de servicio para la llamada interna a organization-service
      client:
        registration:
          sma-internal:
            authorization-grant-type: client_credentials
            client-id: sma-internal
            client-secret: sma-internal-secret
            provider: keycloak
        provider:
          keycloak:
            token-uri: http://keycloak:8080/realms/sma/protocol/openid-connect/token
  cloud:
    function:
      definition: organizationChange
    stream:
      kafka:
        binder:
          brokers: kafka:9092
      bindings:
        organizationChange-in-0:
          destination: sma.organization.changes
          group: licensing-group
          content-type: application/json

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

# --- Resilience4j (Etapa 5) ---
resilience4j.circuitbreaker:
  instances:
    licenseService:
      registerHealthIndicator: true
      slidingWindowType: COUNT_BASED
      slidingWindowSize: 5
      permittedNumberOfCallsInHalfOpenState: 3
      waitDurationInOpenState: 10s
      failureRateThreshold: 50
      recordExceptions:
        - org.springframework.web.client.HttpServerErrorException
        - java.io.IOException
        - java.util.concurrent.TimeoutException
        - org.springframework.web.client.ResourceAccessException
    organizationService:
      registerHealthIndicator: true
      slidingWindowType: COUNT_BASED
      slidingWindowSize: 6
      permittedNumberOfCallsInHalfOpenState: 4
      waitDurationInOpenState: 20s
      failureRateThreshold: 60

resilience4j.retry:
  instances:
    retryLicenseService:
      maxAttempts: 5
      waitDuration: 10000ms
      retryExceptions:
        - java.util.concurrent.TimeoutException

resilience4j.bulkhead:
  instances:
    bulkheadLicenseService:
      maxConcurrentCalls: 5
      maxWaitDuration: 10ms

resilience4j.ratelimiter:
  instances:
    licenseService:
      timeoutDuration: 1000ms
      limitRefreshPeriod: 5s
      limitForPeriod: 5
