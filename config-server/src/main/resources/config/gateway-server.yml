server:
  port: 8072

spring:
  cloud:
    gateway:
      discovery:
        locator:
          # Rutas automáticas por service-id: /<service-id-en-minúsculas>/**
          enabled: true
          lower-case-service-id: true
      routes:
        # /organization/** -> organization-service (controlador en /v1/organization)
        - id: organization-service
          uri: lb://organization-service
          predicates:
            - Path=/organization/**
          filters:
            - RewritePath=/organization/(?<path>.*), /v1/organization/$\{path}
        # /licensing/** -> licensing-service (controlador en /v1/organization/{orgId}/license)
        - id: licensing-service
          uri: lb://licensing-service
          predicates:
            - Path=/licensing/**
          filters:
            - RewritePath=/licensing/(?<path>.*), /v1/organization/$\{path}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      # Deshabilitado por defecto desde el endurecimiento de SCG (CVE-2022-22947);
      # hay que habilitarlo explícitamente además de exponerlo.
      enabled: true
