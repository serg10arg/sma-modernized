# ============================================================
# Docker Compose raíz del sistema sma-modernized
# Etapa 2b: config-server + eureka-server + licensing-service + zipkin
# ============================================================

services:

  # --- Zipkin (trazabilidad distribuida) ---
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "${ZIPKIN_PORT:-9411}:9411"
    networks:
      - sma-network

  # --- PostgreSQL (persistencia del licensing-service) ---
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-sma_licensing}
      POSTGRES_USER: ${DB_USER:-sma_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sma_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    networks:
      - sma-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sma_user} -d ${DB_NAME:-sma_licensing}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --- Config Server ---
  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: config-server
    ports:
      - "${CONFIG_SERVER_PORT:-8888}:8888"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider",
             "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - sma-network

  # --- Eureka Server ---
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "${EUREKA_SERVER_PORT:-8761}:8761"
    environment:
      # Apunta al config-server dentro de la red Docker (resuelto en application.yml)
      - CONFIG_SERVER_URL=http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - sma-network

  # --- Gateway Server (API Gateway) ---
  gateway-server:
    build:
      context: .
      dockerfile: gateway-server/Dockerfile
    container_name: gateway-server
    ports:
      - "8072:8072"
    environment:
      CONFIG_SERVER_URI: http://config-server:8888
      EUREKA_SERVER_URI: http://eureka-server:8761/eureka/
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider",
             "http://localhost:8072/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sma-network

  # --- Licensing Service ---
  licensing-service:
    build:
      context: .
      dockerfile: licensing-service/Dockerfile
    container_name: licensing-service
    # Sin mapeo de puerto al host: accesible vía gateway (8072) y por sma-network
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - CONFIG_SERVER_URI=http://config-server:8888
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-sma_licensing}
      - DB_USER=${DB_USER:-sma_user}
      - DB_PASSWORD=${DB_PASSWORD:-sma_password}
      - EUREKA_SERVER_URI=http://eureka-server:8761/eureka/
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - sma-network

  # --- Organization Service ---
  organization-service:
    build:
      context: .
      dockerfile: organization-service/Dockerfile
    container_name: organization-service
    # Sin mapeo de puerto al host: accesible vía gateway (8072) y por sma-network
    environment:
      CONFIG_SERVER_URI: http://config-server:8888
      EUREKA_SERVER_URI: http://eureka-server:8761/eureka/
      DB_HOST: postgres
      DB_PORT: 5432
      ORG_DB_NAME: sma_organization
      ORG_DB_USER: ${DB_USER:-sma_user}
      ORG_DB_PASSWORD: ${DB_PASSWORD:-sma_password}
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - sma-network

  # --- Keycloak (Identity Provider, Etapa 7) ---
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      # El issuer del token debe ser estable y resoluble igual dentro y fuera de Docker
      KC_HOSTNAME: http://keycloak:8080
      KC_HOSTNAME_STRICT: "false"
      # Expone los endpoints de salud en el puerto de management (9000)
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - sma-network

  # --- Kafka (broker de mensajería asíncrona, Etapa 8) ---
  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka
    environment:
      # --- Identidad y roles (KRaft: broker + controlador en un nodo) ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # --- Listeners ---
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # Anuncia kafka:9092 (nombre en la red Docker), NO localhost
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # --- Single-node: todo con replicacion 1 ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # --- Dev: crea topics automaticamente al primer uso ---
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - sma-network
    healthcheck:
      # La imagen no trae curl; usamos la CLI de Kafka para confirmar que el broker responde
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      start_period: 30s
      interval: 10s
      timeout: 10s
      retries: 15

networks:
  sma-network:
    driver: bridge

volumes:
  postgres-data:
  kafka-data:
