# ============================================================
# Docker Compose raíz del sistema sma-modernized
# Etapa 2b: config-server + eureka-server + licensing-service + zipkin
# ============================================================

services:

  # --- Zipkin (trazabilidad distribuida) ---
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "${ZIPKIN_PORT:-9411}:9411"
    networks:
      - sma-network

  # --- Config Server ---
  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: config-server
    ports:
      - "${CONFIG_SERVER_PORT:-8888}:8888"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider",
             "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - sma-network

  # --- Eureka Server ---
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "${EUREKA_SERVER_PORT:-8761}:8761"
    environment:
      # Apunta al config-server dentro de la red Docker (resuelto en application.yml)
      - CONFIG_SERVER_URL=http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - sma-network

  # --- Licensing Service ---
  licensing-service:
    build:
      context: .
      dockerfile: licensing-service/Dockerfile
    container_name: licensing-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=default
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

networks:
  sma-network:
    driver: bridge
